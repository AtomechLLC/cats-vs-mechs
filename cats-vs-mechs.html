<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cats vs Mechs — Workshop 16 Interactive Sample</title>
<style>
  /* ===================== [C00] TOKENS ===================== */
  :root{
    --bg:#0e1014;
    --bg-2:#15181f;
    --panel:#191d26;
    --panel-2:#1f2530;
    --ink:#e8ebf2;
    --ink-dim:#a4adbe;
    --ink-faint:#6c7689;
    --line:#2a3140;
    --accent:#5cc8ff;
    --accent-2:#ff7eb6;
    --gold:#ffd166;
    --green:#5bd99c;
    --violet:#b98cff;
    --radius:14px;
    /* artifact-specific */
    --coral:#ff8a5c;--maxw:1280px;
  }

  /* ===================== [C01] BASE ===================== */
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:radial-gradient(1200px 700px at 80% -10%, #1a2030 0%, var(--bg) 55%) no-repeat fixed,var(--bg);
    color:var(--ink);
    font:17px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  /* every numeric readout in this file gets stable digit widths */
  .num{font-variant-numeric:tabular-nums}

  /* ===================== [C02] SHELL ===================== */
  .shell{max-width:var(--maxw);margin:0 auto;padding:28px 22px}
  .shell-head{margin:0 0 18px}
  .shell-head h1{margin:0 0 2px;font-size:32px;line-height:1.2;letter-spacing:-.4px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 22px;margin:14px 0}
  .card.tight{padding:16px 18px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}

  .eyebrow{color:var(--accent-2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .muted{color:var(--ink-dim)}
  .faint{color:var(--ink-faint)}

  .callout{border-radius:10px;padding:14px 18px;margin:16px 0;border:1px solid var(--line);background:var(--panel-2)}
  .callout.accent{border-left:3px solid var(--accent)}
  .callout.gold{border-left:3px solid var(--gold)}
  .callout.green{border-left:3px solid var(--green)}
  .callout.pink{border-left:3px solid var(--accent-2)}
  .callout b{color:#fff}

  .ex{display:inline-block;font-size:12px;color:var(--green);background:rgba(91,217,156,.08);
    border:1px solid rgba(91,217,156,.25);padding:2px 9px;border-radius:6px;margin-top:6px}

  /* ===================== [C08] BOOT — ERROR PANEL ===================== */
  .err-panel{position:fixed;right:18px;bottom:18px;max-width:520px;z-index:50;margin:0;
    background:var(--panel-2);display:flex;flex-direction:column;gap:8px}
  .err-panel[hidden]{display:none}
  .err-title{font-weight:700;color:var(--ink)}
  .err-message{color:var(--ink-dim)}
  .err-detail{background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--ink-dim);
    width:100%;min-height:96px;padding:8px 10px;
    font-family:ui-monospace,Consolas,monospace;font-size:12.5px;resize:vertical;user-select:text}
  .err-actions{display:flex;gap:8px;flex-wrap:wrap}
  .err-btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
  .err-btn:hover{border-color:var(--accent)}
  .err-btn--danger{border-color:var(--accent-2);color:var(--accent-2)}

  /* ===================== [C09] SELFTEST REPORT ===================== */
  .st-report[hidden]{display:none}
  .st-summary{font-size:20px;font-weight:700;margin:6px 0 12px}
  .st-rows{display:flex;flex-direction:column;gap:6px}
  .st-row{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:14px}
  .st-row--pass{border-left:3px solid var(--green)}
  .st-row--fail{border-left:3px solid var(--coral)}
  .st-row b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
  .st-row--pass b{color:var(--green)}
  .st-row--fail b{color:var(--coral)}
  .st-detail{color:var(--ink-dim);font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
</style>
</head>
<body>

<main class="shell" id="app">

  <div class="shell-head">
    <h1>Cats vs Mechs</h1>
    <div class="muted">Workshop 16 — allocation and fight sandbox</div>
  </div>

  <div class="board" id="board">
    <p class="muted" id="board-empty">The allocation board renders here.</p>
  </div>

  <section class="card st-report" id="selftest-report" hidden>
    <div class="eyebrow">Developer self-test</div>
    <div class="st-summary num" id="selftest-summary"></div>
    <div class="st-rows" id="selftest-rows"></div>
  </section>

</main>

<div class="callout pink err-panel" id="err-panel" hidden role="alert">
  <div class="eyebrow">Something went wrong</div>
  <div class="err-title" id="err-title"></div>
  <div class="err-message" id="err-message"></div>
  <textarea class="err-detail" id="err-detail" readonly aria-label="Error details"></textarea>
  <div class="err-actions">
    <button type="button" class="err-btn" id="err-dismiss">Dismiss and continue</button>
    <button type="button" class="err-btn err-btn--danger" id="err-reset">Reset to Workshop 16 defaults</button>
  </div>
</div>

<script>
/* =========================================================================
 * TABLE OF CONTENTS — the section banner is the file tree.
 * Search a token such as [S03] and you land in exactly one place.
 *
 *   [S00] APP           the single global namespace + the hash-flag test   (plan 01-01)
 *   [S01] DATA          deep-frozen Workshop 16 board defaults             (plan 01-01)
 *   [S02] MODEL         pure eHP / damage-throughput derivations           (plan 01-01)
 *   [S03] STATE         the state slices, commit() funnel, snapshot undo   (plan 01-02)
 *   [S04] SERIALIZE     build-code encode / decode + hash sync             (Phase 4, plan 04-01)
 *   [S05] OPS           every state transformation, one per student action (plan 01-02)
 *   [S06] RENDER        page structure and per-tick reconcile from state   (Phase 2, plan 02-01)
 *   [S07] INTERACTIONS  delegated handlers on stable roots                 (Phase 2, plan 02-02)
 *   [S08] BOOT          wiring + the error boundary                        (plan 01-02)
 *   [S09] SELFTEST      in-file assertions, gated behind #selftest         (plan 01-01)
 *   [S10] LAUNCH        the one entry call                                 (plan 01-01)
 *
 * Region order is fixed. Dependency arrows point DOWN only; reference another
 * section as App.x.y() at the call site, never by capturing it at section-body
 * scope, so reordering can never break anything.
 *
 * Two deliberate divergences from the sibling course artifacts:
 *   1. This file introduces one global, App. The siblings use bare top-level
 *      const, which is fine at 400-700 lines and stops working at several
 *      thousand.
 *   2. Each section is an IIFE opening with 'use strict'. Strict mode is what
 *      makes a write to the frozen defaults throw instead of failing silently.
 * Section banners and #region markers sit at column 0; code is indented two
 * spaces, matching the siblings.
 * ========================================================================= */

/* ===================== [S00] APP =====================
 * The single global. Every section hangs off it.
 * hasFlag() is the only place hash text is read anywhere in this file, and it
 * compares whole tokens by exact equality: a link ending #notselftest or
 * #selftestx must not open the developer report. Hash text never reaches a
 * page sink or a dynamic code path.
 * deps: none
 * owner: plan 01-01
 * ===================================================== */
// #region [S00] APP
var App = {};

App.hasFlag = function (name) {
  'use strict';
  if (typeof location === 'undefined') { return false; }
  var raw = location.hash || '';
  if (raw.charAt(0) === '#') { raw = raw.slice(1); }
  var tokens = raw.split(',');
  for (var i = 0; i < tokens.length; i++) {
    if (tokens[i].trim() === name) { return true; }
  }
  return false;
};
// #endregion [S00] APP

/* ===================== [S01] DATA =====================
 * The deep-frozen Workshop 16 board, and the recursive freeze helper.
 * Damage attaches to actions, health attaches to units, action points attach
 * to the faction. Every number in here is an integer.
 * deepFreeze is exported as App.data.deepFreeze because [S03] STATE reuses
 * this exact function rather than keeping a second copy of it.
 * deps: none
 * owner: plan 01-01
 * ====================================================== */
// #region [S01] DATA
App.data = (function () {
  'use strict';

  // Object.freeze is shallow; the board is three levels deep.
  function deepFreeze(o) {
    if (o === null || typeof o !== 'object') { return o; }
    Object.getOwnPropertyNames(o).forEach(function (k) {
      var v = o[k];
      if (v !== null && typeof v === 'object' && !Object.isFrozen(v)) { deepFreeze(v); }
    });
    return Object.freeze(o);
  }

  // Units are built by a loop, so a roster change is one number rather than
  // twelve near-identical literals drifting apart.
  function makeUnits(idPrefix, namePrefix, howMany, stats) {
    var units = [];
    for (var i = 1; i <= howMany; i++) {
      units.push({
        id: idPrefix + i,
        name: namePrefix + ' ' + i,
        maxHp: stats.maxHp,
        shield: stats.shield
      });
    }
    return units;
  }

  // D-01: a literal reading of the board's token rows. A starting point, not a
  // conclusion — the Phase 5 playtest gate (plan 05-03) is the mechanism that
  // retunes these, and this object is the single place that edit happens.
  // Effect keyword ids live here; their card copy and the action-versus-action
  // reference table are data.reference, owned by Phase 3 plan 03-02.
  var DEFAULTS = deepFreeze({
    schema: 1,
    cats: {
      id: 'cats',
      name: 'Cats',
      ap: 3,
      units: makeUnits('c', 'Cat', 9, { maxHp: 3, shield: 0 }),
      actions: [
        { id: 'slash', name: 'Slash', dmg: 1, keywords: [] },
        { id: 'hairball', name: 'Hairball', dmg: 0, keywords: ['slowdown'] },
        { id: 'screech', name: 'Screech', dmg: 0, keywords: ['confuse'] }
      ]
    },
    mechs: {
      id: 'mechs',
      name: 'Mechs',
      ap: 3,
      units: makeUnits('m', 'Mech', 3, { maxHp: 6, shield: 3 }),
      actions: [
        { id: 'fly', name: 'Fly', dmg: 0, keywords: ['evade'] },
        { id: 'lasers', name: 'Lasers', dmg: 3, keywords: ['range'] },
        { id: 'recharge', name: 'Recharge', dmg: 0, keywords: ['shield'] }
      ]
    }
  });

  // A fresh, unfrozen deep copy on every call. The JSON round-trip is both
  // faster than the platform's deep-clone call on this payload and a free guard: anything
  // that is not JSON-clonable disappears loudly instead of surviving silently.
  function defaults() {
    return JSON.parse(JSON.stringify(DEFAULTS));
  }

  return Object.freeze({
    DEFAULTS: DEFAULTS,
    defaults: defaults,
    deepFreeze: deepFreeze
  });
})();
// #endregion [S01] DATA

/* ===================== [S02] MODEL =====================
 * PURE derivations. Every function takes the state, or a slice of it, as an
 * argument. Nothing here reads the state singleton, reads or writes the page,
 * or stores a derived value — a derived value kept in state becomes a second,
 * mechanical reason for the projection to disagree with the board.
 * Turns-to-wipe ranges, formatting and the projection panel are Phase 3
 * (plan 03-01) and deliberately do not live here.
 * deps: none
 * owner: plan 01-01
 * ======================================================= */
// #region [S02] MODEL
App.model = (function () {
  'use strict';

  function unitEhp(unit) {
    return unit.maxHp + unit.shield;
  }

  function factionEhp(faction) {
    return faction.units.reduce(function (n, u) { return n + unitEhp(u); }, 0);
  }

  function bestDamage(faction) {
    return faction.actions.reduce(function (n, a) { return a.dmg > n ? a.dmg : n; }, 0);
  }

  // Throughput is capped by the shared action-point pool, not by unit count.
  // That cap is the whole point of holding action points at faction level.
  function factionDps(faction, activeUnits) {
    var active = (activeUnits === undefined) ? faction.units.length : activeUnits;
    return Math.min(faction.ap, active) * bestDamage(faction);
  }

  // Reads the stored flag. Death is never inferred from hp === 0 — a unit a
  // student ruled "survived via Shield" has to stay representable.
  function aliveCount(fightSide) {
    return fightSide.units.reduce(function (n, u) { return u.alive === true ? n + 1 : n; }, 0);
  }

  function apSpent(buildFaction, fightSide) {
    return buildFaction.ap - fightSide.ap;
  }

  return Object.freeze({
    unitEhp: unitEhp,
    factionEhp: factionEhp,
    bestDamage: bestDamage,
    factionDps: factionDps,
    aliveCount: aliveCount,
    apSpent: apSpent
  });
})();
// #endregion [S02] MODEL

/* ===================== [S03] STATE =====================
 * The single state object, the commit(label, mutator) funnel, the snapshot
 * undo stack and the frame-coalesced invalidate(). Nothing mutates state
 * outside commit(); that one rule is what makes undo, the fight log, hash
 * sync and coalesced rendering free byproducts instead of features.
 *
 * Shape — integers only, JSON-clonable, no DOM nodes, no functions:
 *   { build: { schema, cats, mechs },
 *     fight: null | { round, turn, cats, mechs, log },
 *     ui:    { kbdNav } }
 *   fight side shape: { ap, units: [ { id, hp, alive } ] }
 *
 * There is NO `mode` key anywhere. Mode is derived from `fight !== null`, so
 * the two can never disagree. `alive` is stored, never inferred from hp === 0.
 * Slice lifetimes: `build` round-trips through the share code and the undo
 * stack; `fight` is undo-only and never shared; `ui` is in neither.
 * deps: App.data (deepFreeze), App.serialize, App.render
 * owner: plan 01-02
 * ======================================================= */
// #region [S03] STATE
App.state = (function () {
  'use strict';

  // Named, and exported, so the self-test asserts against the constant rather
  // than against a bare number that could drift away from this definition.
  var UNDO_LIMIT = 30;
  var COALESCE_MS = 500;

  // The live state. Deep-frozen between commits: a stray write from anywhere
  // outside commit() throws TypeError in strict mode and changes nothing. That
  // is the mechanical guarantee this whole section exists to provide.
  var cur = App.data.deepFreeze({
    build: App.data.defaults(),
    fight: null,
    ui: { kbdNav: false }
  });

  var past = [];        // [{ label, snap, t }], newest last, hard-capped at UNDO_LIMIT
  var commits = 0;      // how many commits have landed
  var frames = 0;       // how many render frames have flushed
  var dirty = false;    // a frame is scheduled and has not run yet
  var structural = false; // the next frame must rebuild page structure, not just sync

  // An unfrozen deep copy — and simultaneously the enforcement of the
  // JSON-clonable rule, because anything that is not plain data disappears
  // here loudly instead of surviving into the next commit.
  function thaw(state) {
    return JSON.parse(JSON.stringify(state));
  }

  // One recursive freeze exists in this file, in [S01] DATA. This is a name
  // for it, not a second copy of it.
  function freeze(state) {
    return App.data.deepFreeze(state);
  }

  function now() {
    return Date.now();
  }

  /* ---- the single mutation funnel (D-00a) ---- */
  function commit(label, mutator) {
    var snap = JSON.stringify({ build: cur.build, fight: cur.fight });

    // The snapshot is taken from the live state, but the mutator runs on a
    // detached copy and runs FIRST. A mutator that throws — an unknown unit
    // id, no fight in progress — must leave no trace at all, rather than a
    // phantom undo step over a state that never changed.
    var working = thaw(cur);
    mutator(working);

    var t = now();
    var last = past.length > 0 ? past[past.length - 1] : null;

    // Same label inside the window means one continuous edit — press-and-hold
    // is one undo step, not forty (D-10). The window slides on each repeat.
    if (last !== null && last.label === label && (t - last.t) < COALESCE_MS) {
      last.t = t;
    } else {
      past.push({ label: label, snap: snap, t: t });
      if (past.length > UNDO_LIMIT) { past.shift(); }
    }

    cur = freeze(working);
    commits++;

    // Declared no-op until Phase 4 plan 04-01. The call site exists from day
    // one precisely so nothing has to be retrofitted into this funnel.
    App.serialize.scheduleUrlSync();
    invalidate();
  }

  // ui-only changes. Same thaw/mutate/refreeze cycle, but nothing lands on the
  // undo stack and nothing reaches the share code (D-09). It is a separate,
  // greppable name so "which mutations are undoable" is answered by reading
  // two function names instead of auditing a flag at forty call sites.
  function commitUi(label, mutator) {
    var working = thaw(cur);
    mutator(working);
    cur = freeze(working);
    commits++;
    invalidate();
  }

  // There is deliberately no redo stack and no future array: undo alone is the
  // v1 requirement, and unused machinery in a single file is pure entropy.
  function undo() {
    if (past.length === 0) { return false; }

    var entry = past.pop();
    var snap = JSON.parse(entry.snap);
    var working = thaw(cur);

    // Snapshots span build and fight, so undo crosses the setup/fight
    // boundary — undoing past a started fight un-starts it (D-08). The live ui
    // slice is preserved, never restored.
    working.build = snap.build;
    working.fight = snap.fight;
    cur = freeze(working);

    App.serialize.scheduleUrlSync();
    invalidate({ structural: true });
    return true;
  }

  /* ---- frame-coalesced invalidation ---- */

  // Idempotent by design: a late timer firing after a manual flush() finds
  // dirty already false and does nothing, so the frame tally cannot double.
  function frame() {
    if (!dirty) { return; }
    dirty = false;
    frames++;
    if (structural) {
      structural = false;
      App.render.structure(cur);
    }
    App.render.sync(cur);
  }

  // The bare global call is required: detaching the browser's frame scheduler
  // into a variable and calling it through that variable throws "Illegal
  // invocation" in Chrome. The timer fallback is what lets the headless runner
  // load this file with no page attached.
  function schedule(fn) {
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(fn);
      return;
    }
    setTimeout(fn, 16);
  }

  function invalidate(opts) {
    if (opts && opts.structural) { structural = true; }
    if (dirty) { return; }
    dirty = true;
    schedule(frame);
  }

  // Runs a pending frame right now and reports whether there was one. Lets the
  // self-test assert coalescing without becoming asynchronous.
  function flush() {
    var wasPending = dirty;
    frame();
    return wasPending;
  }

  function get() {
    return cur;
  }

  function undoDepth() {
    return past.length;
  }

  function stats() {
    return { commits: commits, frames: frames, undoDepth: past.length };
  }

  return Object.freeze({
    get: get,
    commit: commit,
    commitUi: commitUi,
    undo: undo,
    undoDepth: undoDepth,
    invalidate: invalidate,
    flush: flush,
    stats: stats,
    UNDO_LIMIT: UNDO_LIMIT,
    COALESCE_MS: COALESCE_MS
  });
})();
// #endregion [S03] STATE

/* ===================== [S04] SERIALIZE =====================
 * Compact positional build code: encode(build) -> string,
 * decode(string) -> build, a mandatory version prefix and a checksum.
 * Knows about `build` only — never about `fight` or `ui`.
 * scheduleUrlSync() is a declared no-op today so that the commit() call site
 * exists from the first day and is never retrofitted.
 * deps: App.data
 * owner: Phase 4, plan 04-01
 * =========================================================== */
// #region [S04] SERIALIZE
App.serialize = Object.freeze({
  // Declared no-op until Phase 4 plan 04-01 fills it in.
  scheduleUrlSync: function () {}
});
// #endregion [S04] SERIALIZE

/* ===================== [S05] OPS =====================
 * Every state transformation, one named function per student action. Each one
 * is a thin wrapper around a single commit() call, and this layer is the only
 * writer of state anywhere in the file — no exceptions, including temporary
 * debug controls. It never reads or writes the page.
 * ops.undo must stay callable from a button, not only from a key handler.
 * deps: App.state, App.data
 * owner: plan 01-02
 * ===================================================== */
// #region [S05] OPS
App.ops = (function () {
  'use strict';

  // Clamp, and reject rather than silently coerce. A bad value must arrive at
  // the error boundary as a named failure the student can read, not as a NaN
  // that renders as an empty token row. Everything a handler supplies — and,
  // from Phase 4, everything a pasted build code supplies — comes through here.
  function int(value, min, max, what) {
    var n = Math.trunc(value);
    if (!Number.isFinite(n)) {
      throw new TypeError('Expected a whole number for ' + what);
    }
    if (n < min) { return min; }
    if (n > max) { return max; }
    return n;
  }

  function findUnit(side, unitId, collection) {
    for (var i = 0; i < collection.length; i++) {
      if (collection[i].id === unitId) { return collection[i]; }
    }
    throw new Error('No unit "' + unitId + '" on side "' + side + '"');
  }

  // Mode is derived, never stored: a null fight slice IS setup.
  function fightOf(s) {
    if (s.fight === null) { throw new Error('No fight in progress'); }
    return s.fight;
  }

  // The fight slice holds only what changes during a fight. Names, actions,
  // damage and keywords stay in build, so a unit has exactly one identity.
  function sideFromBuild(faction) {
    return {
      ap: faction.ap,
      units: faction.units.map(function (u) {
        return { id: u.id, hp: u.maxHp, alive: true };
      })
    };
  }

  /* ---- transformers: each one is exactly one commit ---- */

  function setFactionAp(side, ap) {
    App.state.commit('ap ' + side, function (s) {
      s.build[side].ap = int(ap, 0, 99, 'action points');
    });
  }

  function setUnitMaxHp(side, unitId, maxHp) {
    App.state.commit('maxHp ' + side + '/' + unitId, function (s) {
      findUnit(side, unitId, s.build[side].units).maxHp = int(maxHp, 0, 99, 'max health');
    });
  }

  // Writes the fight slice only, and deliberately touches nothing else: zero
  // health prompts a death ruling from the table, it never auto-kills (D-00d).
  function setUnitHp(side, unitId, hp) {
    App.state.commit('hp ' + side + '/' + unitId, function (s) {
      findUnit(side, unitId, fightOf(s)[side].units).hp = int(hp, 0, 99, 'health');
    });
  }

  // The other half of D-00d: a stored flag, settable independently of health,
  // so a unit ruled "survived via Shield" and a unit ruled dead at full health
  // are both representable.
  function setAlive(side, unitId, alive) {
    App.state.commit('alive ' + side + '/' + unitId, function (s) {
      findUnit(side, unitId, fightOf(s)[side].units).alive = (alive === true);
    });
  }

  function startFight() {
    App.state.commit('start fight', function (s) {
      s.fight = {
        round: 1,
        turn: 'cats',
        log: [],
        cats: sideFromBuild(s.build.cats),
        mechs: sideFromBuild(s.build.mechs)
      };
    });
  }

  // build is left untouched, so "run it again" always restarts from the same
  // allocation the student spent the exercise arriving at.
  function endFight() {
    App.state.commit('end fight', function (s) {
      s.fight = null;
    });
  }

  // One commit, therefore one undo entry (D-12). The undo stack is never
  // cleared here: a mis-clicked reset has to be recoverable.
  function resetToDefaults() {
    App.state.commit('reset to defaults', function (s) {
      s.build = App.data.defaults();
      s.fight = null;
    });
  }

  // The only route into commitUi, so ui changes never reach the undo stack.
  function setUi(key, value) {
    App.state.commitUi('ui ' + key, function (s) {
      s.ui[key] = value;
    });
  }

  // A named function, so a Phase 2 undo button calls exactly what Ctrl+Z calls
  // (D-11). Returns false at the bottom of the stack — a no-op, not an error.
  function undo() {
    return App.state.undo();
  }

  // Phase 2's delegated interaction root calls this and nothing else. The
  // unknown-act throw is also the cheapest live exercise of the error boundary.
  function dispatch(act, payload) {
    var p = payload || {};
    switch (act) {
      case 'ap': return setFactionAp(p.side, p.value);
      case 'maxHp': return setUnitMaxHp(p.side, p.unitId, p.value);
      case 'hp': return setUnitHp(p.side, p.unitId, p.value);
      case 'alive': return setAlive(p.side, p.unitId, p.value);
      case 'startFight': return startFight();
      case 'endFight': return endFight();
      case 'reset': return resetToDefaults();
      case 'undo': return undo();
      default: throw new Error('Unknown op: ' + act);
    }
  }

  // DELIBERATELY ABSENT, do not "helpfully" add them here:
  //   - roster add and remove, and the stepper nudge — Phase 2, plan 02-02
  //   - turn and round advance, action-point spending, damage application and
  //     the fight record — Phase 5, plan 05-01
  // Each arrives with the phase that has a surface to put it on.
  return Object.freeze({
    setFactionAp: setFactionAp,
    setUnitMaxHp: setUnitMaxHp,
    setUnitHp: setUnitHp,
    setAlive: setAlive,
    startFight: startFight,
    endFight: endFight,
    resetToDefaults: resetToDefaults,
    setUi: setUi,
    undo: undo,
    dispatch: dispatch
  });
})();
// #endregion [S05] OPS

/* ===================== [S06] RENDER =====================
 * Produces the page from state, in two tiers, and this split is decided here
 * so Phase 2 inherits it rather than re-deciding it:
 *   structure(state) — the rare rebuild. Runs when the roster's shape changes.
 *   sync(state)      — the per-tick keyed reconcile. Updates text and classes
 *                      in place so the node under the cursor, and the focused
 *                      input, are never destroyed mid-interaction.
 * Never mutates state. Never binds per-node listeners; that is [S07]'s job.
 * deps: App.model, App.data
 * owner: Phase 2, plan 02-01
 * ======================================================== */
// #region [S06] RENDER
App.render = Object.freeze({
  // Declared no-ops until Phase 2 plan 02-01 fills them in.
  structure: function () {},
  sync: function () {}
});
// #endregion [S06] RENDER

/* ===================== [S07] INTERACTIONS =====================
 * Delegated listeners bound once to the stable container roots in the static
 * shell, plus press-and-hold repeat and keyboard handling. Translates one
 * event into exactly one App.ops.* call and nothing else — no arithmetic, no
 * direct page writes.
 * deps: App.ops
 * owner: Phase 2, plan 02-02
 * ============================================================== */
// #region [S07] INTERACTIONS
App.interactions = Object.freeze({
  // Declared no-op until Phase 2 plan 02-02 fills it in.
  bind: function () {}
});
// #endregion [S07] INTERACTIONS

/* ===================== [S08] BOOT =====================
 * The entry point and the error boundary. attempt(label, fn) runs one wiring
 * step inside a try/catch so a single failure is non-terminal and surfaces in
 * the styled panel instead of blanking the page. start() is called exactly
 * once, from [S10] LAUNCH.
 * deps: [S03] STATE, App.render, App.interactions, App.selftest
 * owner: plan 01-02
 * ====================================================== */
// #region [S08] BOOT
App.boot = (function () {
  'use strict';
  // STUB — plan 01-02 replaces these bodies; the selftest gate line must survive.

  function attempt(label, fn) {
    try {
      fn();
    } catch (err) {
      console.error(label, err);
    }
  }

  function start() {
    if (App.hasFlag('selftest')) { App.selftest.report(App.selftest.run()); }
  }

  return Object.freeze({ attempt: attempt, start: start });
})();
// #endregion [S08] BOOT

/* ===================== [S09] SELFTEST =====================
 * In-file assertions. Ships with the artifact because stripping it would need
 * a build step, and stays invisible unless the hash carries the exact token
 * `selftest`. The report is a readable pass/fail list rather than a console
 * dump, because the person who needs it opened the file by double-click.
 * Every string that reaches the page here goes through createElement plus
 * textContent — assertion labels and, from Phase 4, decoded build data are
 * echoed back, so there is no markup-parsing path anywhere in this renderer.
 * deps: App.data, App.model
 * owner: plan 01-01
 * ========================================================== */
// #region [S09] SELFTEST
App.selftest = (function () {
  'use strict';

  var suites = [];

  function suite(name, fn) {
    suites.push({ name: name, fn: fn });
  }

  function makeAsserts(records, suiteName) {
    function push(name, pass, actual, expected) {
      records.push({
        suite: suiteName,
        name: name,
        pass: pass === true,
        actual: actual,
        expected: expected
      });
    }
    return {
      eq: function (label, actual, expected) {
        push(label, JSON.stringify(actual) === JSON.stringify(expected), actual, expected);
      },
      ok: function (label, condition) {
        push(label, !!condition, !!condition, true);
      },
      throws: function (label, fn) {
        var threw = false;
        try { fn(); } catch (e) { threw = true; }
        push(label, threw, threw, true);
      }
    };
  }

  function run() {
    var records = [];
    suites.forEach(function (s) {
      var t = makeAsserts(records, s.name);
      try {
        s.fn(t);
      } catch (err) {
        // A thrown suite costs one failing record, never the rest of the run.
        records.push({
          suite: s.name,
          name: 'suite threw',
          pass: false,
          actual: String(err),
          expected: 'no exception'
        });
      }
    });
    var passed = 0;
    var failed = 0;
    records.forEach(function (r) {
      if (r.pass) { passed++; } else { failed++; }
    });
    return { records: records, passed: passed, failed: failed };
  }

  function describe(value) {
    if (typeof value === 'string') { return value; }
    try { return JSON.stringify(value); } catch (e) { return String(value); }
  }

  function report(result) {
    if (typeof document === 'undefined') { return; }
    var panel = document.getElementById('selftest-report');
    var summary = document.getElementById('selftest-summary');
    var rows = document.getElementById('selftest-rows');
    if (!panel || !summary || !rows) { return; }

    summary.textContent = result.passed + ' passed, ' + result.failed + ' failed';
    rows.replaceChildren();

    // Failures first, so a red row is visible without scrolling.
    var ordered = result.records.slice().sort(function (a, b) {
      if (a.pass === b.pass) { return 0; }
      return a.pass ? 1 : -1;
    });

    ordered.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'st-row ' + (r.pass ? 'st-row--pass' : 'st-row--fail');

      var head = document.createElement('b');
      head.textContent = (r.pass ? 'PASS' : 'FAIL') + ' — ' + r.suite;
      row.appendChild(head);

      var label = document.createElement('div');
      label.textContent = r.name;
      row.appendChild(label);

      if (!r.pass) {
        var detail = document.createElement('div');
        detail.className = 'st-detail';
        detail.textContent = 'actual: ' + describe(r.actual) + ' — expected: ' + describe(r.expected);
        row.appendChild(detail);
      }

      rows.appendChild(row);
    });

    panel.hidden = false;
  }

  return Object.freeze({ suite: suite, run: run, report: report });
})();

/* --- [S09.1] SUITE: board defaults — owner plan 01-01 --- */
(function () {
  'use strict';

  function tuple(action) {
    return [action.id, action.name, action.dmg, action.keywords];
  }

  // Walks anything JSON-shaped and rejects a non-integer number, a NaN, an
  // undefined or a function.
  function allIntegers(value) {
    if (value === null) { return true; }
    if (typeof value === 'number') { return Number.isInteger(value); }
    if (typeof value === 'string' || typeof value === 'boolean') { return true; }
    if (Array.isArray(value)) { return value.every(function (v) { return allIntegers(v); }); }
    if (typeof value === 'object') {
      return Object.keys(value).every(function (k) { return allIntegers(value[k]); });
    }
    return false;
  }

  App.selftest.suite('board defaults', function (t) {
    var d = App.data.defaults();

    t.eq('cats unit count', d.cats.units.length, 9);
    t.ok('cats unit maxHp', d.cats.units.every(function (u) { return u.maxHp === 3; }));
    t.ok('cats unit shield', d.cats.units.every(function (u) { return u.shield === 0; }));
    t.eq('cats faction ap', d.cats.ap, 3);

    t.eq('mechs unit count', d.mechs.units.length, 3);
    t.ok('mechs unit maxHp', d.mechs.units.every(function (u) { return u.maxHp === 6; }));
    t.ok('mechs unit shield', d.mechs.units.every(function (u) { return u.shield === 3; }));
    t.eq('mechs faction ap', d.mechs.ap, 3);

    t.eq('cats actions', d.cats.actions.map(tuple), [
      ['slash', 'Slash', 1, []],
      ['hairball', 'Hairball', 0, ['slowdown']],
      ['screech', 'Screech', 0, ['confuse']]
    ]);
    t.eq('mechs actions', d.mechs.actions.map(tuple), [
      ['fly', 'Fly', 0, ['evade']],
      ['lasers', 'Lasers', 3, ['range']],
      ['recharge', 'Recharge', 0, ['shield']]
    ]);

    var ids = d.cats.units.concat(d.mechs.units).map(function (u) { return u.id; });
    t.eq('unit ids unique', new Set(ids).size, 12);

    t.ok('defaults are integers', allIntegers(d));

    t.throws('DEFAULTS is deep-frozen', function () {
      App.data.DEFAULTS.cats.units[0].maxHp = 99;
    });
    t.eq('DEFAULTS survived the frozen write', App.data.DEFAULTS.cats.units[0].maxHp, 3);

    var a = App.data.defaults();
    var b = App.data.defaults();
    t.ok('defaults() is a fresh deep copy', a !== b && a.cats.units !== b.cats.units);
    a.cats.units[0].maxHp = 99;
    t.eq('a mutated copy leaves the next copy alone', b.cats.units[0].maxHp, 3);
    t.eq('a mutated copy leaves DEFAULTS alone', App.data.DEFAULTS.cats.units[0].maxHp, 3);
  });
})();

/* --- [S09.2] SUITE: model derivations — owner plan 01-01 --- */
(function () {
  'use strict';

  App.selftest.suite('model derivations', function (t) {
    var d = App.data.defaults();

    // The two sides landing on the same eHP is a coincidence of the board's
    // token rows, not a claim about the matchup. Phase 5's playtest gate is
    // what settles that question, by being played.
    t.eq('cats eHP', App.model.factionEhp(d.cats), 27);
    t.eq('mechs eHP', App.model.factionEhp(d.mechs), 27);

    t.eq('cats best damage', App.model.bestDamage(d.cats), 1);
    t.eq('mechs best damage', App.model.bestDamage(d.mechs), 3);

    t.eq('cats throughput', App.model.factionDps(d.cats), 3);
    t.eq('mechs throughput', App.model.factionDps(d.mechs), 9);
    t.eq('throughput respects the ap cap', App.model.factionDps(d.cats, 1), 1);

    var snapshot = JSON.stringify(d.cats);
    App.model.factionEhp(d.cats);
    App.model.factionEhp(d.cats);
    t.eq('model is pure', JSON.stringify(d.cats), snapshot);

    // Zero HP but flagged alive counts; full HP but flagged dead does not.
    var side = {
      ap: 3,
      units: [
        { id: 'c1', hp: 0, alive: true },
        { id: 'c2', hp: 3, alive: false }
      ]
    };
    t.eq('alive is read, not inferred', App.model.aliveCount(side), 1);

    t.eq('apSpent', App.model.apSpent({ ap: 3 }, { ap: 1 }), 2);

    t.ok('all derivations return integers', [
      App.model.unitEhp(d.cats.units[0]),
      App.model.factionEhp(d.cats),
      App.model.bestDamage(d.mechs),
      App.model.factionDps(d.mechs),
      App.model.aliveCount(side),
      App.model.apSpent(d.cats, side)
    ].every(Number.isInteger));
  });
})();

/* --- [S09.3] SUITE: state contract — owner plan 01-02 --- */
(function () {
  'use strict';

  // The same shape walk [S09.1] runs over the frozen board, applied here to
  // the live state: rejects a fractional number, a NaN, an undefined value or
  // a function anywhere in the tree.
  function allIntegers(value) {
    if (value === null) { return true; }
    if (typeof value === 'number') { return Number.isInteger(value); }
    if (typeof value === 'string' || typeof value === 'boolean') { return true; }
    if (Array.isArray(value)) { return value.every(function (v) { return allIntegers(v); }); }
    if (typeof value === 'object') {
      return Object.keys(value).every(function (k) { return allIntegers(value[k]); });
    }
    return false;
  }

  App.selftest.suite('state contract', function (t) {
    var i;

    function unitOf(side, id) {
      return App.state.get().fight[side].units.filter(function (u) {
        return u.id === id;
      })[0];
    }

    // Exercising the contract necessarily writes to the live board, so record
    // where the suite found it; the last act below hands it back.
    var before = JSON.stringify(App.state.get().build);
    t.eq('the suite started from the shipped defaults', before, JSON.stringify(App.data.defaults()));

    /* --- shape --- */
    t.eq('three slices', Object.keys(App.state.get()), ['build', 'fight', 'ui']);
    t.ok('no mode key', !Object.prototype.hasOwnProperty.call(App.state.get().ui, 'mode'));
    t.ok('integers only', allIntegers({
      build: App.state.get().build,
      fight: App.state.get().fight
    }));

    var live = JSON.stringify(App.state.get());
    t.eq('json clonable', JSON.stringify(JSON.parse(live)), live);

    /* --- the frozen guard: two depths, because a shallow freeze passes the
           first probe and silently allows the second --- */
    var apWas = App.state.get().build.cats.ap;
    t.throws('frozen between commits', function () {
      App.state.get().build.cats.ap = 99;
    });
    t.eq('the frozen write changed nothing', App.state.get().build.cats.ap, apWas);

    var maxHpWas = App.state.get().build.cats.units[0].maxHp;
    t.throws('frozen deep inside a nested array', function () {
      App.state.get().build.cats.units[0].maxHp = 99;
    });
    t.eq('the nested frozen write changed nothing', App.state.get().build.cats.units[0].maxHp, maxHpWas);

    /* --- the funnel --- */
    var depth0 = App.state.undoDepth();
    App.ops.setFactionAp('cats', 5);
    t.eq('commit is the only writer', App.state.get().build.cats.ap, 5);
    t.eq('a commit adds exactly one undo entry', App.state.undoDepth() - depth0, 1);
    t.throws('dispatch rejects an unknown act', function () {
      App.ops.dispatch('notAnOp', {});
    });

    /* --- alive is a flag, not an inference (D-00d) --- */
    App.ops.startFight();
    App.ops.setUnitHp('cats', 'c1', 0);
    t.ok('alive independent of hp', unitOf('cats', 'c1').hp === 0 && unitOf('cats', 'c1').alive === true);
    App.ops.setAlive('cats', 'c2', false);
    t.ok('a full-health unit can be ruled dead', unitOf('cats', 'c2').alive === false && unitOf('cats', 'c2').hp === 3);
    t.eq('aliveCount reads the flags, not the hit points', App.model.aliveCount(App.state.get().fight.cats), 8);

    /* --- depth and ordering. Distinct labels, so nothing coalesces. --- */
    var seq = [];
    for (i = 0; i < 40; i++) { seq.push(i + 1); }
    seq.forEach(function (v, n) {
      App.state.commit('seq ' + n, function (s) { s.build.cats.ap = v; });
    });

    var ordered = true;
    for (i = 0; i < App.state.UNDO_LIMIT; i++) {
      App.state.undo();
      // Undo n restores the state before commit 40-n, which is the value the
      // commit before it wrote.
      if (App.state.get().build.cats.ap !== seq[38 - i]) { ordered = false; }
    }
    t.ok('undo restores 30 states in order', ordered);

    var drained = 0;
    while (App.state.undo()) {
      drained++;
      if (drained > 500) { break; }
    }
    t.ok('undo cap is a no-op, not an error', App.state.undo() === false);

    /* --- burst coalescing (D-10) --- */
    App.state.commit('before the burst', function (s) { s.build.cats.ap = 7; });
    var preBurst = App.state.get().build.cats.ap;
    var depthB = App.state.undoDepth();
    for (i = 0; i < 40; i++) {
      App.state.commit('burst', function (s) { s.build.cats.ap = 12; });
    }
    t.eq('burst coalesces to one entry', App.state.undoDepth() - depthB, 1);
    App.state.undo();
    t.eq('one undo restores the pre-burst value', App.state.get().build.cats.ap, preBurst);

    /* --- undo crosses the setup/fight boundary (D-08) --- */
    App.ops.endFight();
    App.ops.startFight();
    t.ok('a fight is in progress', App.state.get().fight !== null);
    App.state.undo();
    t.eq('undo crosses the fight boundary', App.state.get().fight, null);

    /* --- ui is outside the stack (D-09) --- */
    var depthU = App.state.undoDepth();
    App.ops.setUi('kbdNav', true);
    t.eq('ui changes are not undoable', App.state.undoDepth(), depthU);
    t.eq('the ui change still landed', App.state.get().ui.kbdNav, true);

    /* --- reset is one entry, and is itself undoable (D-12) --- */
    App.state.commit('before the reset', function (s) { s.build.cats.ap = 11; });
    var depthR = App.state.undoDepth();
    App.ops.resetToDefaults();
    t.eq('reset is one undo entry', App.state.undoDepth() - depthR, 1);
    t.eq('reset restored the shipped ap', App.state.get().build.cats.ap, App.data.defaults().cats.ap);
    App.state.undo();
    t.eq('undo brings the pre-reset build back', App.state.get().build.cats.ap, 11);

    /* --- one frame per burst --- */
    App.state.flush();
    var frames0 = App.state.stats().frames;
    for (i = 0; i < 50; i++) { App.state.invalidate(); }
    App.state.flush();
    t.eq('invalidate coalesces to one frame', App.state.stats().frames - frames0, 1);

    /* --- the thaw/freeze cycle has to stay cheap enough to be invisible --- */
    var started = Date.now();
    for (i = 0; i < 100; i++) {
      App.state.commit('perf ' + i, function (s) { s.build.cats.ap = 4; });
    }
    var elapsed = Date.now() - started;
    t.ok('100 commits stay fast', elapsed < 50);

    /* --- hand the board back --- */
    App.ops.resetToDefaults();
    t.eq('state restored to defaults', App.state.get().build, App.data.defaults());
  });
})();
// #endregion [S09] SELFTEST

/* ===================== [S10] LAUNCH =====================
 * The one entry call. The guard is what lets a headless runner load this
 * script with no page attached and reach App directly.
 * deps: App.boot
 * owner: plan 01-01
 * ======================================================== */
// #region [S10] LAUNCH
if (typeof document !== 'undefined') { App.boot.start(); }
// #endregion [S10] LAUNCH
</script>
